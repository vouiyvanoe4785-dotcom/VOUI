{% if widget.is_initial %}
<div class="d-flex align-items-center gap-3 mb-2">
  <img src="{{ widget.preview_url }}" alt="Logo actuel" style="max-height: 48px; max-width: 160px;" class="border rounded p-1 bg-white">
  {% if not widget.required %}
  <div class="form-check">
    <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="form-check-input"{% if widget.attrs.disabled %} disabled{% endif %}>
    <label for="{{ widget.checkbox_id }}" class="form-check-label small">{{ widget.clear_checkbox_label }}</label>
  </div>
  {% endif %}
</div>
{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
