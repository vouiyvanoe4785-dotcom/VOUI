{% extends "base.html" %}
{% block title %}Supprimer {{ object }} - Ayden Transit{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body p-4">
    <h5>Supprimer "{{ object }}" ?</h5>
    <p class="text-muted">Cette action est irréversible.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
      <a href="{% url 'partners:detail' object.pk %}" class="btn btn-outline-secondary">Annuler</a>
    </form>
  </div>
</div>
{% endblock %}
