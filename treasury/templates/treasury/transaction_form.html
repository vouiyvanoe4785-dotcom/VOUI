{% extends "base.html" %}
{% block title %}Nouveau mouvement - {{ account.nom }}{% endblock %}
{% block content %}
<div class="page-header">
  <h3 class="section-title"><i class="bi bi-arrow-left-right"></i> Nouveau mouvement - {{ account.nom }}</h3>
  <a href="{% url 'treasury:account_detail' account.pk %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
</div>
<div class="card">
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary mt-4"><i class="bi bi-check-lg"></i> Enregistrer le mouvement</button>
    </form>
  </div>
</div>
{% endblock %}
